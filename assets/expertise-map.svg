<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Карта компетенций">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050d12"/>
      <stop offset=".55" stop-color="#0b171b"/>
      <stop offset="1" stop-color="#050d12"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4db6b6" stroke-opacity=".11"/>
    </pattern>

    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4db6b6" stop-opacity="0"/>
      <stop offset=".34" stop-color="#4db6b6" stop-opacity=".025"/>
      <stop offset=".72" stop-color="#4db6b6" stop-opacity=".11"/>
      <stop offset=".94" stop-color="#7ce6e4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7ce6e4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanLineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce6e4" stop-opacity="0"/>
      <stop offset=".12" stop-color="#7ce6e4" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#b3ffff" stop-opacity=".85"/>
      <stop offset=".88" stop-color="#7ce6e4" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7ce6e4" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scanGlow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --bg: #050d12;
      --panel: #0f1b1f;
      --panel2: #10191d;
      --line: #203f42;
      --accent: #4db6b6;
      --accent2: #208080;
      --text: #d9e5e4;
      --muted: #769392;
      --sand: #d6c1a3;
      --brown: #8a6e4d;
    }

    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .label {
      fill: var(--accent);
      letter-spacing: 2px;
    }

    .text {
      fill: var(--text);
    }

    .muted {
      fill: var(--muted);
    }

    .frame {
      fill: none;
      stroke: var(--accent);
      stroke-opacity: .55;
    }

    .thin {
      fill: none;
      stroke: var(--accent);
      stroke-opacity: .34;
    }

    .grid {
      opacity: .32;
      animation: grid 18s linear infinite;
    }

    .scan {
      animation: scan 7s linear infinite;
      pointer-events: none;
    }

    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2.8s ease-in-out infinite;
    }

    .dash {
      stroke-dasharray: 8 12;
      animation: dash 14s linear infinite;
    }

    .blink {
      animation: blink 1.2s steps(1) infinite;
    }

    .fade1 {
      animation: fade 5s ease-in-out infinite;
    }

    .float {
      animation: float 6s ease-in-out infinite;
    }

    .draw {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw 5s ease forwards infinite;
    }

    .bar {
      transform-origin: left center;
      animation: bar 5s ease-in-out infinite;
    }

    .row1 {
      animation: appear 8s ease-in-out infinite;
    }

    .row2 {
      animation: appear 8s .5s ease-in-out infinite;
    }

    .row3 {
      animation: appear 8s 1s ease-in-out infinite;
    }

    .row4 {
      animation: appear 8s 1.5s ease-in-out infinite;
    }

    .coreOrbit {
      transform-box: fill-box;
      transform-origin: center;
      animation: coreOrbit 12s linear infinite;
    }

    .geoCube {
      transform-box: fill-box;
      transform-origin: center;
      animation: geoCube 7s ease-in-out infinite;
    }

    .geoScan {
      animation: geoScan 4s ease-in-out infinite;
    }

    @keyframes grid {
      to {
        transform: translate(32px, 24px);
      }
    }

    @keyframes scan {
      0% {
        transform: translateY(-150px);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      88% {
        opacity: 1;
      }

      100% {
        transform: translateY(770px);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .35;
        transform: scale(.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -400;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes fade {
      0%, 100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 800;
        opacity: .1;
      }

      40%, 85% {
        stroke-dashoffset: 0;
        opacity: 1;
      }

      100% {
        stroke-dashoffset: -800;
        opacity: .1;
      }
    }

    @keyframes bar {
      0%, 15% {
        transform: scaleX(.12);
      }

      50%, 85% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(.12);
      }
    }

    @keyframes appear {
      0%, 8%, 100% {
        opacity: .2;
        transform: translateX(-8px);
      }

      20%, 80% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes coreOrbit {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes geoCube {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-7px) rotate(3deg);
      }
    }

    @keyframes geoScan {
      0%, 100% {
        opacity: .18;
      }

      50% {
        opacity: .72;
      }
    }
  </style>

  <rect width="1400" height="620" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="618" rx="11" fill="none" stroke="#285256"/>

  <g class="grid">
    <rect x="-32" y="-24" width="1464" height="668" fill="url(#grid)"/>
  </g>

  <g transform="translate(55 42)">
    <text class="label" font-size="18">EXPERTISE MAP // КАРТА КОМПЕТЕНЦИЙ</text>
    <path d="M0 26H1290" class="thin"/>

    <g transform="translate(55 95)">
      <circle cx="595" cy="215" r="78" fill="#0d2023" stroke="#4db6b6"/>
      <circle cx="595" cy="215" r="105" class="thin dash"/>

      <g class="coreOrbit">
        <ellipse cx="595" cy="215" rx="128" ry="38" class="thin"/>
        <ellipse cx="595" cy="215" rx="128" ry="38" class="thin" transform="rotate(60 595 215)"/>
        <ellipse cx="595" cy="215" rx="128" ry="38" class="thin" transform="rotate(-60 595 215)"/>
      </g>

      <text x="595" y="207" text-anchor="middle" class="text" font-size="23" font-weight="700">
        FRONTEND
      </text>
      <text x="595" y="237" text-anchor="middle" class="label" font-size="14">
        SYSTEM ENGINEERING
      </text>

      <path
        d="M490 175L270 85M700 175L920 85M490 255L270 345M700 255L920 345"
        class="thin draw"
        stroke-width="2"
      />

      <g transform="translate(0 20)">
        <rect width="310" height="145" fill="#0b161a" stroke="#285256"/>
        <text x="20" y="30" class="label" font-size="16">PLATFORM &amp; ARCHITECTURE</text>
        <text x="20" y="64" class="text" font-size="15">TypeScript · React · Next.js</text>
        <text x="20" y="91" class="text" font-size="15">FSD · Effector · URQL</text>
        <text x="20" y="118" class="text" font-size="15">RHF · Zod · Design Systems</text>
      </g>

      <g transform="translate(880 20)">
        <g class="geoCube" transform="translate(238 28) scale(.35)">
          <path
            d="M0 70L92 14l110 58-92 58zM0 70v100l110 60V130M202 72v100l-92 58"
            fill="none"
            stroke="#4db6b6"
            stroke-width="4"
          />
          <path
            class="geoScan"
            d="M110 130L290 20L310 145Z"
            fill="#4db6b6"
            fill-opacity=".12"
            stroke="#4db6b6"
          />
        </g>

        <rect width="310" height="145" fill="#0b161a" stroke="#285256"/>
        <text x="20" y="30" class="label" font-size="16">3D &amp; GEO</text>
        <text x="20" y="64" class="text" font-size="15">Three.js · WebGL</text>
        <text x="20" y="91" class="text" font-size="15">MapLibre GL · Terrain</text>
        <text x="20" y="118" class="text" font-size="15">LOD · Culling · Custom Layers</text>
      </g>

      <g transform="translate(0 295)">
        <rect width="310" height="145" fill="#0b161a" stroke="#285256"/>
        <text x="20" y="30" class="label" font-size="16">REAL-TIME &amp; MEDIA</text>
        <text x="20" y="64" class="text" font-size="15">WebRTC · WHEP · HLS</text>
        <text x="20" y="91" class="text" font-size="15">SignalR · WebSocket</text>
        <text x="20" y="118" class="text" font-size="15">Live telemetry · Streaming</text>
      </g>

      <g transform="translate(880 295)">
        <rect width="310" height="145" fill="#0b161a" stroke="#285256"/>
        <text x="20" y="30" class="label" font-size="16">QUALITY &amp; PERFORMANCE</text>
        <text x="20" y="64" class="text" font-size="15">CPU / GPU profiling</text>
        <text x="20" y="91" class="text" font-size="15">Heap snapshots · DevTools</text>
        <text x="20" y="118" class="text" font-size="15">Batching · Rendering budgets</text>
      </g>
    </g>
  </g>

  <g class="scan">
    <rect
      x="0"
      y="-126"
      width="1400"
      height="126"
      fill="url(#scanG)"
    />

    <rect
      x="0"
      y="-4"
      width="1400"
      height="2"
      fill="url(#scanLineG)"
      filter="url(#scanGlow)"
      opacity=".78"
    />

    <rect
      x="0"
      y="-2"
      width="1400"
      height="1"
      fill="#d5ffff"
      opacity=".48"
    />
  </g>
</svg>