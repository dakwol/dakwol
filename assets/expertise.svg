<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="expertise-title">
<title id="expertise-title">Инженерная специализация Даниила Фоменко</title>
<defs>
  <linearGradient id="card-gradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141d24"/>
    <stop offset="1" stop-color="#0d1217"/>
  </linearGradient>
  <pattern id="small-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#49c9cb" stroke-opacity=".045"/>
  </pattern>
</defs>

<style>
  :root {
    --background: #080b0e;
    --surface: #10161b;
    --surface-strong: #141d24;
    --border: #20313c;
    --accent: #49c9cb;
    --accent-light: #7ce6e4;
    --text: #f6f9fb;
    --secondary: #9da8b3;
    --muted: #65727d;
  }

  .title {
    fill: var(--text);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -1.5px;
  }

  .label {
    fill: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .body {
    fill: var(--secondary);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 500;
  }

  .mono {
    fill: var(--secondary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .grid {
    animation: gridShift 18s linear infinite;
  }

  .pulse {
    animation: pulse 2.8s ease-in-out infinite;
    transform-origin: center;
  }

  .pulse-delay {
    animation: pulse 3.4s ease-in-out 1.1s infinite;
    transform-origin: center;
  }

  .scan {
    animation: scan 7s linear infinite;
  }

  .dash {
    stroke-dasharray: 10 16;
    animation: dash 14s linear infinite;
  }

  .float {
    animation: float 6s ease-in-out infinite;
  }

  .float-delay {
    animation: float 7.5s ease-in-out 1.2s infinite;
  }

  .rotate {
    animation: rotate 24s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  .fade {
    animation: fade 5s ease-in-out infinite;
  }

  @keyframes gridShift {
    from { transform: translate(0, 0); }
    to { transform: translate(32px, 24px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.88); }
    50% { opacity: 1; transform: scale(1.18); }
  }

  @keyframes scan {
    0% { transform: translateX(-420px); opacity: 0; }
    12% { opacity: .9; }
    70% { opacity: .3; }
    100% { transform: translateX(1500px); opacity: 0; }
  }

  @keyframes dash {
    to { stroke-dashoffset: -520; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes fade {
    0%, 100% { opacity: .35; }
    50% { opacity: .9; }
  }
</style>

<rect width="1400" height="650" rx="34" fill="#080b0e"/>
<rect x="1" y="1" width="1398" height="648" rx="33" fill="none" stroke="#20313c"/>
<rect width="1400" height="650" rx="34" fill="url(#small-grid)"/>

<text x="70" y="82" class="label" font-size="14">01 / ENGINEERING DOMAINS</text>
<text x="70" y="135" class="title" font-size="45">Инженерная специализация</text>
<text x="70" y="175" class="body" font-size="19">Области, в которых я беру ответственность за архитектуру и технический результат.</text>

<g transform="translate(70 225)">
  <g class="float">
    <rect width="295" height="340" rx="25" fill="url(#card-gradient)" stroke="#20313c"/>
    <text x="28" y="45" class="label" font-size="13">01</text>
    <text x="28" y="91" class="title" font-size="29">Архитектура</text>
    <text x="28" y="129" class="body" font-size="17">Масштабируемые React-системы</text>
    <path d="M28 158H267" stroke="#20313c"/>
    <text x="28" y="202" class="mono" font-size="16">Feature-Sliced Design</text>
    <text x="28" y="238" class="mono" font-size="16">Domain boundaries</text>
    <text x="28" y="274" class="mono" font-size="16">Typed contracts</text>
    <text x="28" y="310" class="mono" font-size="16">Technical leadership</text>
  </g>

  <g transform="translate(320)" class="float-delay">
    <rect width="295" height="340" rx="25" fill="url(#card-gradient)" stroke="#49c9cb" stroke-opacity=".62"/>
    <text x="28" y="45" class="label" font-size="13">02</text>
    <text x="28" y="91" class="title" font-size="29">3D и GIS</text>
    <text x="28" y="129" class="body" font-size="17">Графика как часть продукта</text>
    <path d="M28 158H267" stroke="#20313c"/>
    <text x="28" y="202" class="mono" font-size="16">Three.js / WebGL</text>
    <text x="28" y="238" class="mono" font-size="16">MapLibre GL</text>
    <text x="28" y="274" class="mono" font-size="16">Terrain geometry</text>
    <text x="28" y="310" class="mono" font-size="16">LOD / culling</text>
  </g>

  <g transform="translate(640)" class="float">
    <rect width="295" height="340" rx="25" fill="url(#card-gradient)" stroke="#20313c"/>
    <text x="28" y="45" class="label" font-size="13">03</text>
    <text x="28" y="91" class="title" font-size="29">Real-time</text>
    <text x="28" y="129" class="body" font-size="17">Потоки данных и видео</text>
    <path d="M28 158H267" stroke="#20313c"/>
    <text x="28" y="202" class="mono" font-size="16">WebRTC / WHEP</text>
    <text x="28" y="238" class="mono" font-size="16">SignalR / WebSocket</text>
    <text x="28" y="274" class="mono" font-size="16">Live telemetry</text>
    <text x="28" y="310" class="mono" font-size="16">Media synchronization</text>
  </g>

  <g transform="translate(960)" class="float-delay">
    <rect width="295" height="340" rx="25" fill="url(#card-gradient)" stroke="#20313c"/>
    <text x="28" y="45" class="label" font-size="13">04</text>
    <text x="28" y="91" class="title" font-size="29">Performance</text>
    <text x="28" y="129" class="body" font-size="17">Измеримые оптимизации</text>
    <path d="M28 158H267" stroke="#20313c"/>
    <text x="28" y="202" class="mono" font-size="16">CPU / GPU profiling</text>
    <text x="28" y="238" class="mono" font-size="16">Memory diagnostics</text>
    <text x="28" y="274" class="mono" font-size="16">Rendering pipelines</text>
    <text x="28" y="310" class="mono" font-size="16">High-load interfaces</text>
  </g>
</g>
</svg>
