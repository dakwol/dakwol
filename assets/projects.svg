<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="projects-title">
<title id="projects-title">Избранные проекты Даниила Фоменко</title>
<defs>
  <linearGradient id="project-surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#121a20"/>
    <stop offset="1" stop-color="#0b1014"/>
  </linearGradient>
</defs>

<style>
  :root {
    --background: #080b0e;
    --surface: #10161b;
    --surface-strong: #141d24;
    --border: #20313c;
    --accent: #49c9cb;
    --accent-light: #7ce6e4;
    --text: #f6f9fb;
    --secondary: #9da8b3;
    --muted: #65727d;
  }

  .title {
    fill: var(--text);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -1.5px;
  }

  .label {
    fill: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .body {
    fill: var(--secondary);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 500;
  }

  .mono {
    fill: var(--secondary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .grid {
    animation: gridShift 18s linear infinite;
  }

  .pulse {
    animation: pulse 2.8s ease-in-out infinite;
    transform-origin: center;
  }

  .pulse-delay {
    animation: pulse 3.4s ease-in-out 1.1s infinite;
    transform-origin: center;
  }

  .scan {
    animation: scan 7s linear infinite;
  }

  .dash {
    stroke-dasharray: 10 16;
    animation: dash 14s linear infinite;
  }

  .float {
    animation: float 6s ease-in-out infinite;
  }

  .float-delay {
    animation: float 7.5s ease-in-out 1.2s infinite;
  }

  .rotate {
    animation: rotate 24s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  .fade {
    animation: fade 5s ease-in-out infinite;
  }

  @keyframes gridShift {
    from { transform: translate(0, 0); }
    to { transform: translate(32px, 24px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.88); }
    50% { opacity: 1; transform: scale(1.18); }
  }

  @keyframes scan {
    0% { transform: translateX(-420px); opacity: 0; }
    12% { opacity: .9; }
    70% { opacity: .3; }
    100% { transform: translateX(1500px); opacity: 0; }
  }

  @keyframes dash {
    to { stroke-dashoffset: -520; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes fade {
    0%, 100% { opacity: .35; }
    50% { opacity: .9; }
  }
</style>

<rect width="1400" height="720" rx="34" fill="#080b0e"/>
<rect x="1" y="1" width="1398" height="718" rx="33" fill="none" stroke="#20313c"/>
<text x="70" y="82" class="label" font-size="14">03 / SELECTED PROJECTS</text>
<text x="70" y="135" class="title" font-size="45">Проекты как инженерные продукты</text>
<text x="70" y="175" class="body" font-size="19">Публичные направления, через которые я развиваю архитектуру, продуктовый подход и сложный frontend.</text>

<g transform="translate(70 225)">
  <g class="float">
    <rect width="400" height="400" rx="26" fill="url(#project-surface)" stroke="#49c9cb" stroke-opacity=".58"/>
    <text x="30" y="48" class="label" font-size="13">01 / ACTIVE</text>
    <text x="30" y="106" class="title" font-size="43">PRIZMA</text>
    <text x="30" y="149" class="body" font-size="17">
      <tspan x="30" dy="0">Архитектурная модель цифрового мира</tspan>
      <tspan x="30" dy="28">и платформы его представления.</tspan>
    </text>
    <path d="M30 215H370" stroke="#20313c"/>
    <text x="30" y="260" class="mono" font-size="15">Architecture · Domain Model</text>
    <text x="30" y="294" class="mono" font-size="15">TypeScript · Product Design</text>
    <text x="30" y="350" class="label" font-size="12">github.com/dakwol/prizma</text>
  </g>

  <g transform="translate(430)" class="float-delay">
    <rect width="400" height="400" rx="26" fill="url(#project-surface)" stroke="#20313c"/>
    <text x="30" y="48" class="label" font-size="13">02 / GIS</text>
    <text x="30" y="106" class="title" font-size="43">GEOSIGHT</text>
    <text x="30" y="149" class="body" font-size="17">
      <tspan x="30" dy="0">Геопространственный интерфейс</tspan>
      <tspan x="30" dy="28">для работы с картой и данными.</tspan>
    </text>
    <path d="M30 215H370" stroke="#20313c"/>
    <text x="30" y="260" class="mono" font-size="15">GIS · Visualization</text>
    <text x="30" y="294" class="mono" font-size="15">Frontend Architecture</text>
    <text x="30" y="350" class="label" font-size="12">github.com/dakwol/geosight</text>
  </g>

  <g transform="translate(860)" class="float">
    <rect width="400" height="400" rx="26" fill="url(#project-surface)" stroke="#20313c"/>
    <text x="30" y="48" class="label" font-size="13">03 / PRODUCT</text>
    <text x="30" y="100" class="title" font-size="34">FINANCE TRACKER</text>
    <text x="30" y="149" class="body" font-size="17">
      <tspan x="30" dy="0">Личное финансовое пространство</tspan>
      <tspan x="30" dy="28">на базе Google Sheets API.</tspan>
    </text>
    <path d="M30 215H370" stroke="#20313c"/>
    <text x="30" y="260" class="mono" font-size="15">Next.js · OAuth · Zod</text>
    <text x="30" y="294" class="mono" font-size="15">Sheets API · Drive API</text>
    <text x="30" y="350" class="label" font-size="12">github.com/dakwol/Finance-Tracker-Web</text>
  </g>
</g>
</svg>
