<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="Инженерный профиль">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050d12"/>
      <stop offset=".55" stop-color="#0b171b"/>
      <stop offset="1" stop-color="#050d12"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4db6b6" stroke-opacity=".11"/>
    </pattern>

    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4db6b6" stop-opacity="0"/>
      <stop offset=".34" stop-color="#4db6b6" stop-opacity=".025"/>
      <stop offset=".72" stop-color="#4db6b6" stop-opacity=".11"/>
      <stop offset=".94" stop-color="#7ce6e4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7ce6e4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanLineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce6e4" stop-opacity="0"/>
      <stop offset=".12" stop-color="#7ce6e4" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#b3ffff" stop-opacity=".85"/>
      <stop offset=".88" stop-color="#7ce6e4" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7ce6e4" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="scanGlow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --bg: #050d12;
      --panel: #0f1b1f;
      --panel2: #10191d;
      --line: #203f42;
      --accent: #4db6b6;
      --accent2: #208080;
      --text: #d9e5e4;
      --muted: #769392;
      --sand: #d6c1a3;
      --brown: #8a6e4d;
    }

    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .label {
      fill: var(--accent);
      letter-spacing: 2px;
    }

    .text {
      fill: var(--text);
    }

    .muted {
      fill: var(--muted);
    }

    .frame {
      fill: none;
      stroke: var(--accent);
      stroke-opacity: .55;
    }

    .thin {
      fill: none;
      stroke: var(--accent);
      stroke-opacity: .34;
    }

    .grid {
      opacity: .32;
      animation: grid 18s linear infinite;
    }

    .scan {
      animation: scan 7s linear infinite;
      pointer-events: none;
    }

    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2.8s ease-in-out infinite;
    }

    .dash {
      stroke-dasharray: 8 12;
      animation: dash 14s linear infinite;
    }

    .blink {
      animation: blink 1.2s steps(1) infinite;
    }

    .fade1 {
      animation: fade 5s ease-in-out infinite;
    }

    .float {
      animation: float 6s ease-in-out infinite;
    }

    .draw {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw 5s ease forwards infinite;
    }

    .bar {
      transform-origin: left center;
      animation: bar 5s ease-in-out infinite;
    }

    .row1 {
      animation: appear 8s ease-in-out infinite;
    }

    .row2 {
      animation: appear 8s .5s ease-in-out infinite;
    }

    .row3 {
      animation: appear 8s 1s ease-in-out infinite;
    }

    .row4 {
      animation: appear 8s 1.5s ease-in-out infinite;
    }

    @keyframes grid {
      to {
        transform: translate(32px, 24px);
      }
    }

    @keyframes scan {
      0% {
        transform: translateY(-150px);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      88% {
        opacity: 1;
      }

      100% {
        transform: translateY(590px);
        opacity: 0;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .35;
        transform: scale(.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -400;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes fade {
      0%, 100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 800;
        opacity: .1;
      }

      40%, 85% {
        stroke-dashoffset: 0;
        opacity: 1;
      }

      100% {
        stroke-dashoffset: -800;
        opacity: .1;
      }
    }

    @keyframes bar {
      0%, 15% {
        transform: scaleX(.12);
      }

      50%, 85% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(.12);
      }
    }

    @keyframes appear {
      0%, 8%, 100% {
        opacity: .2;
        transform: translateX(-8px);
      }

      20%, 80% {
        opacity: 1;
        transform: translateX(0);
      }
    }
  </style>

  <rect width="1400" height="440" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="438" rx="11" fill="none" stroke="#285256"/>

  <g class="grid">
    <rect x="-32" y="-24" width="1464" height="488" fill="url(#grid)"/>
  </g>

  <g transform="translate(55 42)">
    <text class="label" font-size="18">SYSTEM PROFILE // ИНЖЕНЕРНЫЙ ПРОФИЛЬ</text>
    <path d="M0 26H1290" class="thin"/>

    <g transform="translate(0 65)">
      <rect width="420" height="290" fill="#0b161a" stroke="#285256"/>

      <text x="26" y="42" class="muted" font-size="15">IDENTITY</text>
      <text x="26" y="86" class="text" font-size="28" font-weight="700">ДАНИИЛ ФОМЕНКО</text>
      <text x="26" y="126" class="label" font-size="17">SENIOR FRONTEND ENGINEER</text>

      <text x="26" y="180" class="muted" font-size="15">DOMAIN</text>
      <text x="26" y="222" class="text" font-size="17">COMPLEX WEB SYSTEMS</text>
      <text x="26" y="250" class="text" font-size="17">3D · GIS · REAL-TIME</text>
    </g>

    <g transform="translate(455 65)">
      <rect width="835" height="290" fill="#0b161a" stroke="#285256"/>

      <text x="26" y="42" class="muted" font-size="15">MISSION</text>

      <text x="26" y="84" class="text" font-size="22">
        <tspan x="26">Проектирую frontend-системы, которые сохраняют</tspan>
        <tspan x="26" dy="34">понятность при росте команды, продукта и данных.</tspan>
      </text>

      <text x="26" y="176" class="muted" font-size="15">OPERATING PRINCIPLES</text>

      <g class="row1">
        <circle cx="32" cy="210" r="5" fill="#4db6b6"/>
        <text x="52" y="216" class="text" font-size="16">Корректность раньше декоративной сложности</text>
      </g>

      <g class="row2">
        <circle cx="32" cy="244" r="5" fill="#4db6b6"/>
        <text x="52" y="250" class="text" font-size="16">Измеримая производительность</text>
      </g>

      <g class="row3">
        <circle cx="450" cy="210" r="5" fill="#4db6b6"/>
        <text x="470" y="216" class="text" font-size="16">Ясные технические границы</text>
      </g>

      <g class="row4">
        <circle cx="450" cy="244" r="5" fill="#4db6b6"/>
        <text x="470" y="250" class="text" font-size="16">Развитие инженерной команды</text>
      </g>
    </g>
  </g>

  <g class="scan">
    <rect
      x="0"
      y="-126"
      width="1400"
      height="126"
      fill="url(#scanG)"
    />

    <rect
      x="0"
      y="-4"
      width="1400"
      height="2"
      fill="url(#scanLineG)"
      filter="url(#scanGlow)"
      opacity=".78"
    />

    <rect
      x="0"
      y="-2"
      width="1400"
      height="1"
      fill="#d5ffff"
      opacity=".48"
    />
  </g>
</svg>