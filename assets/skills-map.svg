<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="skills-title">
<title id="skills-title">Карта hard skills Даниила Фоменко</title>
<defs>
  <radialGradient id="node-glow">
    <stop offset="0" stop-color="#49c9cb" stop-opacity=".45"/>
    <stop offset="1" stop-color="#49c9cb" stop-opacity="0"/>
  </radialGradient>
  <filter id="node-shadow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>
  :root {
    --background: #080b0e;
    --surface: #10161b;
    --surface-strong: #141d24;
    --border: #20313c;
    --accent: #49c9cb;
    --accent-light: #7ce6e4;
    --text: #f6f9fb;
    --secondary: #9da8b3;
    --muted: #65727d;
  }

  .title {
    fill: var(--text);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -1.5px;
  }

  .label {
    fill: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .body {
    fill: var(--secondary);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 500;
  }

  .mono {
    fill: var(--secondary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .grid {
    animation: gridShift 18s linear infinite;
  }

  .pulse {
    animation: pulse 2.8s ease-in-out infinite;
    transform-origin: center;
  }

  .pulse-delay {
    animation: pulse 3.4s ease-in-out 1.1s infinite;
    transform-origin: center;
  }

  .scan {
    animation: scan 7s linear infinite;
  }

  .dash {
    stroke-dasharray: 10 16;
    animation: dash 14s linear infinite;
  }

  .float {
    animation: float 6s ease-in-out infinite;
  }

  .float-delay {
    animation: float 7.5s ease-in-out 1.2s infinite;
  }

  .rotate {
    animation: rotate 24s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  .fade {
    animation: fade 5s ease-in-out infinite;
  }

  @keyframes gridShift {
    from { transform: translate(0, 0); }
    to { transform: translate(32px, 24px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.88); }
    50% { opacity: 1; transform: scale(1.18); }
  }

  @keyframes scan {
    0% { transform: translateX(-420px); opacity: 0; }
    12% { opacity: .9; }
    70% { opacity: .3; }
    100% { transform: translateX(1500px); opacity: 0; }
  }

  @keyframes dash {
    to { stroke-dashoffset: -520; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes fade {
    0%, 100% { opacity: .35; }
    50% { opacity: .9; }
  }
</style>

<rect width="1400" height="760" rx="34" fill="#080b0e"/>
<rect x="1" y="1" width="1398" height="758" rx="33" fill="none" stroke="#20313c"/>
<text x="70" y="82" class="label" font-size="14">02 / HARD SKILLS MAP</text>
<text x="70" y="135" class="title" font-size="45">Карта инженерных компетенций</text>
<text x="70" y="175" class="body" font-size="19">Не список технологий, а связи между платформой, архитектурой, графикой и данными.</text>

<g transform="translate(0 35)">
  <ellipse cx="700" cy="410" rx="390" ry="230" fill="url(#node-glow)" opacity=".24" class="pulse-delay"/>

  <g fill="none" stroke="#49c9cb" stroke-opacity=".28" stroke-width="2" class="dash">
    <path d="M700 365L700 240"/>
    <path d="M700 455L700 580"/>
    <path d="M650 410L450 305"/>
    <path d="M650 410L430 500"/>
    <path d="M750 410L965 300"/>
    <path d="M750 410L980 505"/>
    <path d="M450 305L270 245"/>
    <path d="M430 500L255 560"/>
    <path d="M965 300L1130 235"/>
    <path d="M980 505L1150 570"/>
  </g>

  <g transform="translate(700 410)">
    <circle r="82" fill="#10161b" stroke="#49c9cb" stroke-width="2"/>
    <circle r="68" fill="none" stroke="#49c9cb" stroke-opacity=".3" stroke-dasharray="5 9" class="rotate"/>
    <text y="-8" text-anchor="middle" class="title" font-size="26">FRONTEND</text>
    <text y="24" text-anchor="middle" class="label" font-size="13">ENGINEERING</text>
  </g>

  <g transform="translate(700 215)" class="float">
    <rect x="-105" y="-34" width="210" height="68" rx="18" fill="#10161b" stroke="#20313c"/>
    <text text-anchor="middle" y="7" class="title" font-size="21">Browser Platform</text>
  </g>

  <g transform="translate(700 605)" class="float-delay">
    <rect x="-105" y="-34" width="210" height="68" rx="18" fill="#10161b" stroke="#20313c"/>
    <text text-anchor="middle" y="7" class="title" font-size="21">Performance</text>
  </g>

  <g transform="translate(430 285)" class="float-delay">
    <rect x="-100" y="-34" width="200" height="68" rx="18" fill="#10161b" stroke="#20313c"/>
    <text text-anchor="middle" y="7" class="title" font-size="21">React Architecture</text>
  </g>

  <g transform="translate(410 520)" class="float">
    <rect x="-95" y="-34" width="190" height="68" rx="18" fill="#10161b" stroke="#20313c"/>
    <text text-anchor="middle" y="7" class="title" font-size="21">WebRTC</text>
  </g>

  <g transform="translate(985 280)" class="float">
    <rect x="-95" y="-34" width="190" height="68" rx="18" fill="#10161b" stroke="#49c9cb" stroke-opacity=".6"/>
    <text text-anchor="middle" y="7" class="title" font-size="21">Three.js / GIS</text>
  </g>

  <g transform="translate(1005 525)" class="float-delay">
    <rect x="-110" y="-34" width="220" height="68" rx="18" fill="#10161b" stroke="#20313c"/>
    <text text-anchor="middle" y="7" class="title" font-size="21">Real-time Data</text>
  </g>

  <g transform="translate(245 230)">
    <circle r="13" fill="#49c9cb" filter="url(#node-shadow)" class="pulse"/>
    <text x="-82" y="-24" class="mono" font-size="15">TypeScript</text>
  </g>

  <g transform="translate(230 575)">
    <circle r="13" fill="#49c9cb" filter="url(#node-shadow)" class="pulse-delay"/>
    <text x="-72" y="39" class="mono" font-size="15">Streaming</text>
  </g>

  <g transform="translate(1155 220)">
    <circle r="13" fill="#49c9cb" filter="url(#node-shadow)" class="pulse-delay"/>
    <text x="25" y="-4" class="mono" font-size="15">WebGL</text>
  </g>

  <g transform="translate(1170 585)">
    <circle r="13" fill="#49c9cb" filter="url(#node-shadow)" class="pulse"/>
    <text x="25" y="5" class="mono" font-size="15">SignalR</text>
  </g>
</g>
</svg>
