<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="footer-title">
<title id="footer-title">Инженерный принцип Даниила Фоменко</title>

<style>
  :root {
    --background: #080b0e;
    --surface: #10161b;
    --surface-strong: #141d24;
    --border: #20313c;
    --accent: #49c9cb;
    --accent-light: #7ce6e4;
    --text: #f6f9fb;
    --secondary: #9da8b3;
    --muted: #65727d;
  }

  .title {
    fill: var(--text);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -1.5px;
  }

  .label {
    fill: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .body {
    fill: var(--secondary);
    font-family: Inter, Segoe UI, Arial, sans-serif;
    font-weight: 500;
  }

  .mono {
    fill: var(--secondary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .grid {
    animation: gridShift 18s linear infinite;
  }

  .pulse {
    animation: pulse 2.8s ease-in-out infinite;
    transform-origin: center;
  }

  .pulse-delay {
    animation: pulse 3.4s ease-in-out 1.1s infinite;
    transform-origin: center;
  }

  .scan {
    animation: scan 7s linear infinite;
  }

  .dash {
    stroke-dasharray: 10 16;
    animation: dash 14s linear infinite;
  }

  .float {
    animation: float 6s ease-in-out infinite;
  }

  .float-delay {
    animation: float 7.5s ease-in-out 1.2s infinite;
  }

  .rotate {
    animation: rotate 24s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  .fade {
    animation: fade 5s ease-in-out infinite;
  }

  @keyframes gridShift {
    from { transform: translate(0, 0); }
    to { transform: translate(32px, 24px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.88); }
    50% { opacity: 1; transform: scale(1.18); }
  }

  @keyframes scan {
    0% { transform: translateX(-420px); opacity: 0; }
    12% { opacity: .9; }
    70% { opacity: .3; }
    100% { transform: translateX(1500px); opacity: 0; }
  }

  @keyframes dash {
    to { stroke-dashoffset: -520; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes fade {
    0%, 100% { opacity: .35; }
    50% { opacity: .9; }
  }
</style>

<rect width="1400" height="400" rx="34" fill="#080b0e"/>
<rect x="1" y="1" width="1398" height="398" rx="33" fill="none" stroke="#20313c"/>
<path class="dash" d="M70 315 C300 235 460 390 700 300 S1060 230 1330 300" fill="none" stroke="#49c9cb" stroke-opacity=".23" stroke-width="2"/>
<text x="700" y="90" text-anchor="middle" class="label" font-size="14">ENGINEERING PRINCIPLE</text>
<text x="700" y="160" text-anchor="middle" class="title" font-size="40">Хорошая архитектура — это когда через год</text>
<text x="700" y="212" text-anchor="middle" class="title" font-size="40">тебе приятно открыть собственный код.</text>
<text x="700" y="265" text-anchor="middle" class="body" font-size="18">Даниил Фоменко · Senior Frontend Engineer / Frontend Tech Lead</text>
<circle class="pulse" cx="70" cy="315" r="6" fill="#49c9cb"/>
<circle class="pulse-delay" cx="700" cy="300" r="6" fill="#49c9cb"/>
<circle class="pulse" cx="1330" cy="300" r="6" fill="#49c9cb"/>
</svg>
